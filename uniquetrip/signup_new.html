<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Sign Up | UniqueTrip</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main Navigation">
        <a href="index_new.html" class="logo">UniqueTrip</a>
        <button class="nav-toggle" aria-label="Open navigation" aria-controls="nav-links" aria-expanded="false" tabindex="0">☰</button>
        <ul class="nav-links" id="nav-links">
            <li><a href="index_new.html">Home</a></li>
            <li><a href="flights_new.html">Flights</a></li>
            <li><a href="hotels_new.html">Hotels</a></li>
            <li><a href="holidays_new.html">Holidays</a></li>
            <li><a href="trains_new.html">Trains</a></li>
            <li><a href="buses_new.html">Buses</a></li>
            <li><a href="cabs_new.html">Cabs</a></li>
        </ul>
        <div class="nav-right">
            <button id="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">🌙</button>
        </div>
    </nav>
    

    <main class="auth-container">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p>Sign up to start your journey</p>
            
            <form onsubmit="return false;">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="John Doe" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+91 98765 43210" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="submit-btn">Create Account</button>
                
                <div class="terms">
                    By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </div>
            </form>
            
            <div class="divider">OR</div>
            
            <div class="login-link">
                Already have an account? <a href="login_new.html">Login</a>
            </div>
        </div>
    </main>

    <script defer src="script.js"></script>
</body>
</html>
